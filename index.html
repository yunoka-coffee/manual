<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>愉之香 接客マニュアル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap">
<style>
/* Layout: 縦1列のスマホ向けカード。ステップごとに「絵 → 言うこと → やること → 注意」 */
:root {
  --bg: #F6EFE6;
  --surface: #FFFCF7;
  --ink: #3B2A20;
  --muted: #7A6455;
  --coffee: #6B4226;
  --honey: #D9862B;
  --honey-soft: #FBE7CC;
  --leaf: #4F8A5B;
  --leaf-soft: #E1EFE0;
  --warn: #C2502E;
  --warn-soft: #FBE3D9;
  --rule: #E6D8C8;
  --scene: #FFF6EA;
  --floor: #E9D6BF;
  /* イラスト用 */
  --line: #3B2A20;
  --skin: #F7D4B8;
  --hair: #4A3326;
  --hair2: #8A5A3B;
  --shirt: #FFFDF8;
  --apron: #6B4226;
  --pants: #5A4A42;
  --c1: #8DB6C9;
  --c2: #E8A8A0;
  --wood: #C99A6B;
  --glass: #E8F4FA;
  --water: #A9D3EA;
  --blush: #F2A091;
  --bubble: #FFFFFF;
  --font: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1D1612; --surface: #2A201A; --ink: #F3E7DA; --muted: #C2AE9D;
    --coffee: #D9AE86; --honey: #F0A64A; --honey-soft: #4A3420;
    --leaf: #8CC79A; --leaf-soft: #23382A; --warn: #FF9A78; --warn-soft: #4A2A20;
    --rule: #3E3128; --scene: #3A2E25; --floor: #4E3E31;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1D1612; --surface: #2A201A; --ink: #F3E7DA; --muted: #C2AE9D;
  --coffee: #D9AE86; --honey: #F0A64A; --honey-soft: #4A3420;
  --leaf: #8CC79A; --leaf-soft: #23382A; --warn: #FF9A78; --warn-soft: #4A2A20;
  --rule: #3E3128; --scene: #3A2E25; --floor: #4E3E31;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }

header { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--honey); }
h1 { font-size: 34px; font-weight: 900; line-height: 1.25; margin: 0; color: var(--coffee); text-wrap: balance; }
.lead { margin: 4px 0 0; color: var(--muted); }

.basics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.basic { background: var(--surface); border-radius: 14px; padding: 12px 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.basic svg { width: 36px; height: 36px; }
.basic b { font-size: 15px; }
.basic span { font-size: 12px; color: var(--muted); line-height: 1.4; }

.flow { display: flex; flex-wrap: wrap; gap: 8px; }
.flow a {
  display: inline-flex; align-items: center; gap: 6px;
  text-decoration: none; color: var(--ink); background: var(--surface);
  border: 1.5px solid var(--rule); border-radius: 999px; padding: 4px 12px 4px 5px; font-size: 14px; font-weight: 500;
}
.flow a .n { width: 24px; height: 24px; border-radius: 50%; background: var(--coffee); color: var(--surface); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.flow a.done .n { background: var(--leaf); }
.flow a:focus-visible, .done-btn:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }
.progress { font-size: 13px; color: var(--muted); }
.progress b { color: var(--leaf); font-size: 15px; }

.step { background: var(--surface); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; scroll-margin-top: 16px; }
.step-head { display: flex; align-items: center; gap: 12px; padding: 18px 18px 10px; }
.step-num { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--coffee); color: var(--surface); display: grid; place-items: center; font-weight: 900; font-size: 22px; }
.step-head h2 { margin: 0; font-size: 23px; font-weight: 900; line-height: 1.3; }
.step-head small { display: block; font-size: 13px; color: var(--muted); font-weight: 500; }
.scene { margin: 0 14px; background: var(--scene); border-radius: 16px; }
.scene svg { display: block; width: 100%; height: auto; }
.step-body { padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 16px; }

.label { font-size: 13px; font-weight: 700; letter-spacing: .08em; color: var(--muted); margin: 0 0 6px; }
.say { display: flex; flex-direction: column; gap: 6px; }
.say p { margin: 0; background: var(--honey-soft); border-radius: 14px 14px 14px 4px; padding: 8px 14px; font-weight: 700; font-size: 17px; }
.say .cond { align-self: flex-start; margin-top: 4px; font-size: 13px; font-weight: 700; color: var(--coffee); border: 1.5px solid var(--coffee); border-radius: 999px; padding: 0 10px; }
.todo { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.todo li { display: grid; grid-template-columns: 24px 1fr; gap: 8px; align-items: start; }
.todo li::before {
  content: ""; width: 20px; height: 20px; margin-top: 4px; border-radius: 6px; background: var(--leaf-soft);
  border: 2px solid var(--leaf);
}
.todo li > span { min-width: 0; }
.caution { background: var(--warn-soft); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: start; }
.caution svg { width: 24px; height: 24px; margin-top: 2px; }
.caution b { color: var(--warn); display: block; font-size: 14px; }
.caution p { margin: 0; }
.memo { border: 2px dashed var(--rule); border-radius: 14px; padding: 10px 14px; font-size: 15px; }
.memo b { color: var(--coffee); }
.memo ul { margin: 4px 0 0; padding-left: 1.2em; }

.done-btn {
  align-self: flex-start; font-family: inherit; font-size: 15px; font-weight: 700;
  border: 2px solid var(--leaf); color: var(--leaf); background: transparent;
  border-radius: 999px; padding: 6px 18px; cursor: pointer;
}
.done-btn[aria-pressed="true"] { background: var(--leaf); color: var(--surface); }

.help { background: var(--coffee); color: var(--surface); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
.help h2 { margin: 0; font-size: 20px; font-weight: 900; }
.help p { margin: 0; }
.help .quote { background: var(--surface); color: var(--ink); border-radius: 14px; padding: 10px 14px; font-weight: 700; font-size: 17px; }

/* SVG イラスト */
.ln { stroke: var(--line); stroke-width: 2.4; stroke-linejoin: round; }
.skin { fill: var(--skin); } .hair { fill: var(--hair); } .hair2 { fill: var(--hair2); }
.shirt { fill: var(--shirt); } .apron { fill: var(--apron); } .pants { fill: var(--pants); }
.c1 { fill: var(--c1); } .c2 { fill: var(--c2); }
.wood { fill: var(--wood); } .glassf { fill: var(--glass); } .waterf { fill: var(--water); }
.towel { fill: var(--shirt); } .shoe { fill: var(--line); } .eye { fill: var(--line); }
.blush { fill: var(--blush); opacity: .7; }
.mouth, .strokeonly { fill: none; stroke: var(--line); stroke-width: 2.2; stroke-linecap: round; }
.armS { fill: none; stroke: var(--line); stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
.armF { fill: none; stroke: var(--shirt); stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round; }
.armC1 { stroke: var(--c1); } .armC2 { stroke: var(--c2); }
.floor { fill: var(--floor); }
.door { fill: var(--wood); } .doorwin { fill: var(--glass); }
.bub { fill: var(--bubble); }
.bubtxt { fill: #3B2A20; font-family: var(--font); font-size: 13px; font-weight: 700; }
.steam { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; opacity: .7; }
.screen { fill: #2F3E46; } .accentf { fill: var(--honey); }
.motion { fill: none; stroke: var(--honey); stroke-width: 2.4; stroke-linecap: round; }

@media (max-width: 380px) {
  h1 { font-size: 29px; }
  .step-head h2 { font-size: 21px; }
}
@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">愉之香珈琲 スタッフマニュアル</div>
    <h1>接客の流れ</h1>
    <p class="lead">お客様がいらしてから、お帰りになるまで。6つのステップで覚えよう。</p>
  </header>

  <section aria-label="接客の基本">
    <p class="label">いつでも大事な3つ</p>
    <div class="basics">
      <div class="basic">
        <svg viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15" class="skin ln"/><circle cx="12.5" cy="15" r="1.8" class="eye"/><circle cx="23.5" cy="15" r="1.8" class="eye"/><path d="M11 21 Q18 28 25 21" class="mouth"/></svg>
        <b>笑顔</b><span>口角を<br>少し上げる</span>
      </div>
      <div class="basic">
        <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M3 18 Q18 4 33 18 Q18 32 3 18 Z" class="shirt ln"/><circle cx="18" cy="18" r="6" class="eye"/><circle cx="20" cy="16" r="1.8" fill="#fff"/></svg>
        <b>目を見る</b><span>お客様の<br>顔を見て話す</span>
      </div>
      <div class="basic">
        <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M6 14 h7 l8 -7 v22 l-8 -7 h-7 z" class="accentf ln"/><path d="M25 12 Q29 18 25 24" class="mouth"/><path d="M28.5 8 Q35 18 28.5 28" class="mouth"/></svg>
        <b>はっきりした声</b><span>語尾まで<br>聞こえるように</span>
      </div>
    </div>
  </section>

  <nav aria-label="ステップ一覧">
    <p class="label">流れ <span class="progress" id="progress"></span></p>
    <div class="flow" id="flow"></div>
  </nav>

  <div id="steps" style="display:flex;flex-direction:column;gap:28px"></div>

  <section class="help">
    <h2>困ったときは</h2>
    <p>わからないことを聞かれたら、無理に答えなくて大丈夫。こう言って、先輩か店長に聞こう。</p>
    <p class="quote">「確認してまいります。少々お待ちください」</p>
  </section>
</div>

<script>
(function () {
  /* ---------- イラスト部品 ---------- */
  const arm = (pts, cls = "", skinHand = true) => {
    const p = pts.join(",");
    const n = pts.length;
    const hx = pts[n - 2], hy = pts[n - 1];
    return `<polyline points="${p}" class="armS"/><polyline points="${p}" class="armF ${cls}"/>` +
      (skinHand ? `<circle cx="${hx}" cy="${hy}" r="5.5" class="skin ln"/>` : "");
  };
  const face = (closed) => closed
    ? `<path d="M-10,-116 Q-7,-120 -4,-116 M4,-116 Q7,-120 10,-116" class="mouth"/>`
    : `<circle cx="-7" cy="-117" r="2.3" class="eye"/><circle cx="7" cy="-117" r="2.3" class="eye"/>`;

  // スタッフ（足元が x,y）
  function staff(x, y, pose, extra = "") {
    let arms = "", front = "", closed = false;
    if (pose === "wave") arms = arm([-19, -90, -27, -54]) + arm([19, -90, 34, -110, 38, -128]);
    if (pose === "guide") arms = arm([-19, -90, -27, -54]) + arm([19, -90, 36, -86, 52, -88]);
    if (pose === "tray") arms = arm([-19, -90, -27, -54]) + arm([19, -90, 26, -70, 44, -80]);
    if (pose === "handy") {
      front = `<rect x="-12" y="-86" width="24" height="17" rx="3" class="screen ln"/><rect x="-8" y="-82" width="16" height="9" rx="1.5" class="waterf"/>`;
      arms = arm([-19, -90, -22, -68, -10, -72]) + arm([19, -90, 22, -68, 10, -72]);
    }
    if (pose === "hands") arms = arm([-19, -90, -16, -60, -4, -60]) + arm([19, -90, 16, -60, 4, -60]);
    if (pose === "bow") { closed = true; arms = arm([-19, -90, -14, -58, -3, -56]) + arm([19, -90, 14, -58, 3, -56]); }
    const tilt = pose === "bow" ? `transform="rotate(-6 0 -44)"` : "";
    return `<g transform="translate(${x},${y})">
      <rect x="-14" y="-46" width="11" height="44" rx="4" class="pants ln"/>
      <rect x="3" y="-46" width="11" height="44" rx="4" class="pants ln"/>
      <ellipse cx="-9" cy="-1" rx="8" ry="4" class="shoe"/><ellipse cx="9" cy="-1" rx="8" ry="4" class="shoe"/>
      <g ${tilt}>
        <rect x="-22" y="-98" width="44" height="58" rx="14" class="shirt ln"/>
        <path d="M-17,-80 h34 v38 q0,6 -6,6 h-22 q-6,0 -6,-6 z" class="apron ln"/>
        <path d="M-13,-80 L-9,-97 M13,-80 L9,-97" class="mouth" style="stroke:var(--apron);stroke-width:3"/>
        <circle cx="0" cy="-121" r="21" class="skin ln"/>
        <path d="M-21,-121 A21,21 0 0 1 21,-121 Q12,-118 5,-126 Q-6,-114 -21,-121 Z" class="hair ln"/>
        ${face(closed)}
        <circle cx="-13" cy="-109" r="3.5" class="blush"/><circle cx="13" cy="-109" r="3.5" class="blush"/>
        <path d="M-6,-108 Q0,-102 6,-108" class="mouth"/>
        ${front}${arms}${extra}
      </g>
    </g>`;
  }

  // 立っているお客様
  function guest(x, y, color, hair, armExtra) {
    const longHair = hair === "long"
      ? `<path d="M-20,-116 v26 q0,5 6,5 h4 v-30 z M20,-116 v26 q0,5 -6,5 h-4 v-30 z" class="hair2 ln"/>` : "";
    const hcls = hair === "long" ? "hair2" : "hair";
    return `<g transform="translate(${x},${y})">
      <rect x="-13" y="-46" width="10" height="44" rx="4" class="pants ln"/>
      <rect x="3" y="-46" width="10" height="44" rx="4" class="pants ln"/>
      <ellipse cx="-8" cy="-1" rx="7.5" ry="4" class="shoe"/><ellipse cx="8" cy="-1" rx="7.5" ry="4" class="shoe"/>
      ${longHair}
      <rect x="-20" y="-96" width="40" height="56" rx="13" class="${color} ln"/>
      ${armExtra || (arm([-18, -88, -24, -54], "arm" + color.toUpperCase()) + arm([18, -88, 24, -54], "arm" + color.toUpperCase()))}
      <circle cx="0" cy="-118" r="19" class="skin ln"/>
      <path d="M-19,-118 A19,19 0 0 1 19,-118 Q8,-122 -2,-130 Q-10,-120 -19,-118 Z" class="${hcls} ln"/>
      <circle cx="-6" cy="-114" r="2.1" class="eye"/><circle cx="6" cy="-114" r="2.1" class="eye"/>
      <path d="M-5,-106 Q0,-102 5,-106" class="mouth"/>
    </g>`;
  }

  // 座っているお客様（テーブル天板の y を top に）
  function seated(x, top, color, hair) {
    const longHair = hair === "long"
      ? `<path d="M-20,${top - 76} v26 q0,5 6,5 h4 v-30 z M20,${top - 76} v26 q0,5 -6,5 h-4 v-30 z" class="hair2 ln"/>` : "";
    const hcls = hair === "long" ? "hair2" : "hair";
    return `<g transform="translate(${x},0)">
      ${longHair}
      <rect x="-20" y="${top - 56}" width="40" height="62" rx="13" class="${color} ln"/>
      <circle cx="0" cy="${top - 78}" r="19" class="skin ln"/>
      <path d="M-19,${top - 78} A19,19 0 0 1 19,${top - 78} Q8,${top - 82} -2,${top - 90} Q-10,${top - 80} -19,${top - 78} Z" class="${hcls} ln"/>
      <circle cx="-6" cy="${top - 74}" r="2.1" class="eye"/><circle cx="6" cy="${top - 74}" r="2.1" class="eye"/>
      <path d="M-5,${top - 66} Q0,${top - 62} 5,${top - 66}" class="mouth"/>
    </g>`;
  }

  const table = (x1, x2, top, floorY) =>
    `<rect x="${x1 + 14}" y="${top + 6}" width="7" height="${floorY - top - 6}" class="wood ln"/>
     <rect x="${x2 - 21}" y="${top + 6}" width="7" height="${floorY - top - 6}" class="wood ln"/>
     <rect x="${x1}" y="${top}" width="${x2 - x1}" height="11" rx="4" class="wood ln"/>`;

  const glass = (cx, base) =>
    `<path d="M${cx - 7},${base - 20} L${cx + 7},${base - 20} L${cx + 5.5},${base} L${cx - 5.5},${base} Z" class="glassf ln"/>
     <path d="M${cx - 5.6},${base - 12} L${cx + 5.6},${base - 12} L${cx + 4.6},${base - 1.5} L${cx - 4.6},${base - 1.5} Z" class="waterf"/>`;
  const towel = (cx, base) => `<rect x="${cx - 9}" y="${base - 7}" width="18" height="7" rx="3.5" class="towel ln"/>`;
  const cup = (cx, base, steam = true) =>
    `<ellipse cx="${cx}" cy="${base - 2}" rx="13" ry="3.5" class="shirt ln"/>
     <path d="M${cx + 7},${base - 15} q8,0 7,5 q-1,5 -8,4" class="strokeonly"/>
     <path d="M${cx - 9},${base - 18} h18 v10 q0,7 -9,7 q-9,0 -9,-7 z" class="shirt ln"/>
     ${steam ? `<path d="M${cx - 4},${base - 23} q-3,-5 0,-9 q3,-4 0,-8 M${cx + 4},${base - 23} q-3,-5 0,-9 q3,-4 0,-8" class="steam"/>` : ""}`;
  const door = (x, top, floorY) =>
    `<rect x="${x}" y="${top}" width="56" height="${floorY - top}" rx="4" class="door ln"/>
     <rect x="${x + 10}" y="${top + 12}" width="36" height="44" rx="4" class="doorwin ln"/>
     <circle cx="${x + 46}" cy="${top + 74}" r="3.5" class="accentf ln"/>`;

  function bubble(x, y, w, lines, tx, ty) {
    const h = 14 + lines.length * 18;
    const bx = Math.min(Math.max(tx, x + 18), x + w - 18);
    const b = y + h;
    const txt = lines.map((t, i) => `<text x="${x + w / 2}" y="${y + 22 + i * 18}" text-anchor="middle" class="bubtxt">${t}</text>`).join("");
    return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="15" class="bub ln"/>
      <path d="M${bx - 8},${b - 1.5} L${tx},${ty} L${bx + 8},${b - 1.5} Z" class="bub"/>
      <path d="M${bx - 8},${b} L${tx},${ty} L${bx + 8},${b}" class="strokeonly" style="stroke-width:2.4"/>
      ${txt}`;
  }

  const F = 188; // 床
  const floor = `<rect x="0" y="${F}" width="340" height="22" class="floor"/>`;
  const svg = (inner, label) =>
    `<svg viewBox="0 0 340 210" role="img" aria-label="${label}">${floor}${inner}</svg>`;

  const scenes = {
    welcome: svg(
      door(16, 66, F) +
      guest(66, F, "c1", "short") + guest(104, F, "c2", "long") +
      staff(252, F, "wave") +
      `<path d="M298,58 l10,-6 M300,72 l12,0 M298,86 l10,6" class="motion"/>` +
      bubble(118, 10, 156, ["いらっしゃいませ！"], 236, 54),
      "スタッフが手をあげて、入ってきたお客様2人に「いらっしゃいませ」とあいさつしている"),
    water: svg(
      seated(214, 132, "c1", "short") + seated(288, 132, "c2", "long") +
      table(160, 334, 132, F) +
      `<rect x="242" y="110" width="20" height="22" rx="3" class="shirt ln"/>
       <rect x="246" y="114" width="5" height="5" class="eye"/><rect x="253" y="114" width="5" height="5" class="eye"/>
       <rect x="246" y="121" width="5" height="5" class="eye"/><rect x="254" y="122" width="3" height="3" class="eye"/>` +
      staff(72, F, "tray", `<rect x="30" y="-86" width="64" height="6" rx="3" class="wood ln"/>` +
        glass(42, -86) + glass(58, -86) + towel(76, -86) + towel(76, -93)) +
      bubble(8, 8, 196, ["ご来店ありがとうございます"], 80, 50),
      "スタッフがお水2つとおしぼり2つをトレーにのせて、席のお客様に運んでいる"),
    order: svg(
      seated(214, 132, "c1", "short") + seated(288, 132, "c2", "long") +
      table(160, 334, 132, F) + glass(196, 132) + towel(232, 132) + glass(304, 132) + towel(270, 132) +
      staff(96, F, "handy") +
      bubble(176, 2, 132, ["ブレンド2つ"], 210, 38) +
      bubble(8, 8, 146, ["ブレンド2つですね"], 96, 48),
      "スタッフがハンディ端末を持ち、お客様の注文「ブレンド2つ」をくり返して確認している"),
    serve: svg(
      seated(214, 132, "c1", "short") + seated(288, 132, "c2", "long") +
      table(160, 334, 132, F) + glass(186, 132) + glass(312, 132) +
      staff(72, F, "tray", `<rect x="30" y="-86" width="64" height="6" rx="3" class="wood ln"/>` +
        cup(48, -86) + cup(78, -86)) +
      bubble(10, 6, 160, ["お待たせいたしました"], 78, 48),
      "スタッフがコーヒー2つをトレーで運び、「お待たせいたしました」と声をかけている"),
    register: svg(
      staff(282, F, "hands") +
      `<rect x="150" y="128" width="190" height="${F - 128}" class="wood ln"/>
       <rect x="150" y="122" width="190" height="10" rx="3" class="wood ln"/>
       <path d="M186,122 L192,96 L238,96 L244,122 Z" class="screen ln"/>
       <rect x="198" y="101" width="34" height="13" rx="2" class="waterf"/>` +
      guest(92, F, "c1", "short") +
      bubble(150, 4, 160, ["ありがとうございます"], 276, 52),
      "レジのカウンターの中にスタッフ、前にお客様。スタッフが「ありがとうございます」と言っている"),
    bye: svg(
      door(268, 66, F) +
      guest(298, F, "c2", "long", arm([-18, -88, -24, -54], "armC2") + arm([18, -88, 30, -116, 30, -126], "armC2")) +
      staff(76, F, "bow") +
      `<path d="M38,70 q-6,6 0,12 M28,64 q-10,12 0,24" class="motion"/>` +
      bubble(112, 8, 176, ["ありがとうございました！", "またお越しくださいませ"], 96, 70),
      "スタッフが笑顔でおじぎをして、手をふって帰るお客様を見送っている"),
  };

  /* ---------- 内容 ---------- */
  const warnIcon = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 L22.5 21 H1.5 Z" style="fill:var(--warn)"/><rect x="10.8" y="9" width="2.4" height="6.5" rx="1.2" style="fill:var(--surface)"/><circle cx="12" cy="18" r="1.4" style="fill:var(--surface)"/></svg>`;

  const steps = [
    { id: "step-1", title: "お出迎え・ご案内", sub: "ドアが開いたら", scene: "welcome",
      say: ["いらっしゃいませ！", "何名様ですか？",
        "禁煙のお席と電子タバコのお席がありますが、どちらがよろしいでしょうか？",
        { note: "席が空いているとき", t: "お席は空いておりますので、お好きなお席にどうぞ" },
        { note: "席が空いていないとき", t: "ただいまお席が空いておりませんので、お名前を書いてお待ちください" }],
      todo: ["ドアが開いたら（ドアベルが鳴ったら）、入口の方を見る", "人数と、禁煙か電子タバコの席かを聞いてご案内する", "席までは案内しなくてOK"],
      caution: ["店内は走らない", "お客様に届く声で、はっきりあいさつする"],
      memo: `<b>お子さま連れのお客様</b><ul><li>電子タバコの席にはご案内しない（禁煙席へ）</li></ul>` },
    { id: "step-2", title: "お水とおしぼり", sub: "席に着いたらすぐ", scene: "water",
      say: [{ note: "お水とおしぼりを出しながら", t: "いらっしゃいませ。ご来店ありがとうございます" },
        "ご注文は後ほどがよろしいでしょうか？",
        { note: "注文が決まっているとき", t: "ご注文をお伺いします" },
        { note: "注文が決まっていないとき（テーブルのQRコードを手で示しながら）", t: "スマートフォンでもご注文できますし、スタッフを呼んでいただいても構いません" }],
      todo: ["人数分のお水（氷入り・8分目まで）とおしぼりをトレーにのせる", "グラスは下のほうを持つ（口元は持たない）", "お客様の前に、ひとつずつそっと置く", "その場で注文を聞いたら、最後に必ず復唱して確認する"],
      caution: ["グラスの飲み口にはさわらない", "ていねいな動作と言葉づかいを心がける"] },
    { id: "step-3", title: "オーダーをとる", sub: "呼ばれたら", scene: "order",
      say: [{ note: "呼ばれたら", t: "はい、お伺いします！" },
        "ご注文をお伺いします",
        { note: "必ず復唱", t: "〇〇がおひとつ、△△がおひとつですね" },
        { note: "テーブルを離れるとき", t: "少々お待ちください。失礼いたします" },
        { note: "または", t: "ご準備してまいります。失礼いたします" }],
      todo: ["呼ばれたら、まず返事をしてすぐ行く", "聞いた注文をハンディに入力する", "注文をくり返して確認してから、送信する", "テーブルを離れるときは、一礼する"],
      caution: "送信する前に、必ずくり返して確認。注文まちがいはここで防げる。",
      memo: `<b>時間のメモ</b><ul><li>朝〜12:00 はモーニングの時間</li><li>平日ランチは 11:30〜15:00</li><li>ラストオーダーは フード 21:00／ドリンク 21:30</li></ul>` },
    { id: "step-4", title: "提供する", sub: "できあがったら", scene: "serve",
      say: ["お待たせいたしました。〇〇です", "ごゆっくりどうぞ"],
      todo: ["商品名を言いながら、注文したお客様の前に置く", "カップの持ち手は、お客様の右側に向ける"],
      caution: "小さなお子さまがいる席に熱いものを出すときは、「熱いのでお気をつけください」と声をかける。" },
    { id: "step-5", title: "お会計", sub: "お帰りのときにレジで", scene: "register",
      say: ["ありがとうございます",
        { note: "〇番＝卓番。レジに並んだメニュー名を読み上げる（0円のモーニングは言わなくてOK）", t: "〇番様、ご注文内容を確認させていただきます" },
        "お会計、〇〇円でございます", "〇〇円お預かりします"],
      todo: ["お客様がレジに来たら、手を止めてすぐ行く", "席の注文を確認して、金額を伝える", "おつりとレシートを両手で渡す"],
      caution: ["受け取ったお金は、金額を声に出して確認してからレジに入れる。",
        "クレジットカードで払うお客様には「ただいまカードリーダーを接続しますので、少々お待ちください」と伝える。"] },
    { id: "step-6", title: "お見送り", sub: "最後まで笑顔で", scene: "bye",
      say: ["ありがとうございました！", "またお越しくださいませ"],
      todo: ["お客様の方を向いて、笑顔で軽くおじぎ"],
      caution: "最後が肝心。はっきりとした口調で「ありがとうございました」を伝える。" },
  ];

  /* ---------- 「覚えた」記録（この端末だけ） ---------- */
  const KEY = "yunoka-sekkyaku-done";
  let done = {};
  try { done = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { done = {}; }
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch (e) {} };

  const flow = document.getElementById("flow");
  const wrap = document.getElementById("steps");

  flow.innerHTML = steps.map((s, i) =>
    `<a href="#${s.id}" data-id="${s.id}"><span class="n">${i + 1}</span>${s.title}</a>`).join("");

  wrap.innerHTML = steps.map((s, i) => `
    <article class="step" id="${s.id}">
      <div class="step-head">
        <div class="step-num">${i + 1}</div>
        <h2><small>${s.sub}</small>${s.title}</h2>
      </div>
      <div class="scene">${scenes[s.scene]}</div>
      <div class="step-body">
        <div>
          <p class="label">言うこと</p>
          <div class="say">${s.say.map(t => typeof t === "string"
            ? `<p>「${t}」</p>`
            : `<span class="cond">${t.note}</span><p>「${t.t}」</p>`).join("")}</div>
        </div>
        <div>
          <p class="label">やること</p>
          <ul class="todo">${s.todo.map(t => `<li><span>${t}</span></li>`).join("")}</ul>
        </div>
        <div class="caution">${warnIcon}<div><b>ここに注意</b>${[].concat(s.caution).map(c => `<p>${c}</p>`).join("")}</div></div>
        ${s.memo ? `<div class="memo">${s.memo}</div>` : ""}
        <button type="button" class="done-btn" id="done-${s.id}" data-id="${s.id}" aria-pressed="false">覚えた！</button>
      </div>
    </article>`).join("");

  function render() {
    let n = 0;
    steps.forEach(s => {
      const on = !!done[s.id];
      if (on) n++;
      const b = document.getElementById("done-" + s.id);
      b.setAttribute("aria-pressed", on);
      b.textContent = on ? "✓ 覚えた" : "覚えた！";
      flow.querySelector(`[data-id="${s.id}"]`).classList.toggle("done", on);
    });
    document.getElementById("progress").innerHTML = `｜ <b>${n}</b> / ${steps.length} 覚えた`;
  }
  wrap.addEventListener("click", e => {
    const b = e.target.closest(".done-btn");
    if (!b) return;
    done[b.dataset.id] = !done[b.dataset.id];
    save(); render();
  });
  render();
})();
</script>
</body>
</html>
